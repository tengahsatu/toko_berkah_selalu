<!DOCTYPE html>
<html>
<head>
    <title>Toko Berkah Selalu</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            margin: 0;
        }

        header {
            background-color: green;
            color: white;
            padding: 30px;
        }

        .konten {
            background-color: white;
            max-width: 700px;
            margin: 30px auto;
            padding: 40px;
            border-radius: 15px;
        }

        button {
            background-color: green;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <h1>Toko Berkah Selalu</h1>
        <p>Selamat Datang di Toko Kami</p>
    </header>

    <div class="konten">

        <h2>Tentang Toko Kami</h2>

        <p>
            Kami menyediakan berbagai kebutuhan
            sehari-hari dengan harga terjangkau.
        </p>

        <button>Hubungi Kami</button>

    </div>

</body>
</html>
